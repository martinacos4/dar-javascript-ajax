<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicios de JavaScript</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <h1>Ejercicios de JavaScript</h1>
    <p>Desarrollo de Aplicaciones en Red · Martin Alejandro Acosta Moreno</p>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="javascript.html" class="activo">JavaScript</a>
      <a href="ajax.html">AJAX</a>
    </nav>
  </header>

  <main>
    <section class="tarjeta">
      <h2>1. ¿Es un palíndromo?</h2>
      <label for="texto-palindromo">Escribe una palabra o una frase:</label>
      <div class="fila">
        <input type="text" id="texto-palindromo">
        <button type="button" id="boton-palindromo">Comprobar</button>
      </div>
      <p class="resultado" id="resultado-palindromo"></p>
    </section>

    <section class="tarjeta">
      <h2>2. El mayor de dos números</h2>
      <label for="numero-1">Escribe dos números:</label>
      <div class="fila">
        <input type="number" id="numero-1" step="any">
        <input type="number" id="numero-2" step="any" aria-label="Segundo número">
        <button type="button" id="boton-mayor">Ver el mayor</button>
      </div>
      <p class="resultado" id="resultado-mayor"></p>
    </section>

    <section class="tarjeta">
      <h2>3. Vocales que aparecen en una frase</h2>
      <label for="frase-vocales">Escribe una frase:</label>
      <div class="fila">
        <input type="text" id="frase-vocales">
        <button type="button" id="boton-vocales">Buscar vocales</button>
      </div>
      <p class="resultado" id="resultado-vocales"></p>
    </section>

    <section class="tarjeta">
      <h2>4. Cuántas veces aparece cada vocal</h2>
      <label for="frase-contar">Escribe una frase:</label>
      <div class="fila">
        <input type="text" id="frase-contar">
        <button type="button" id="boton-contar">Contar vocales</button>
      </div>
      <ul class="resultado" id="resultado-contar"></ul>
    </section>
  </main>

  <script src="js/ejercicios.js"></script>
</body>
</html>
